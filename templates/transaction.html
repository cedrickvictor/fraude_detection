<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction - BK Bank Fraud Detection</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">🏦 BK Bank Fraud Detection</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/dashboard">Dashboard</a>
                <a class="nav-link" href="/logout">Logout ({{ username }})</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">New Transaction</h3>
                    </div>
                    <div class="card-body">
                        <form id="transactionForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="amount" class="form-label">Amount ($)</label>
                                    <input type="number" class="form-control" id="amount" name="amount" placeholder="0.00" step="0.01" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="account_age" class="form-label">Account Age (Years)</label>
                                    <input type="number" class="form-control" id="account_age" name="account_age" placeholder="0" step="0.1" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="transaction_type" class="form-label">Transaction Type</label>
                                    <select class="form-control" id="transaction_type" name="transaction_type" required>
                                        <option value="">Select Type</option>
                                        <option value="purchase">Purchase</option>
                                        <option value="withdrawal">Withdrawal</option>
                                        <option value="transfer">Transfer</option>
                                        <option value="deposit">Deposit</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="location" class="form-label">Location</label>
                                    <select class="form-control" id="location" name="location" required>
                                        <option value="">Select Location</option>
                                        <option value="online">Online</option>
                                        <option value="atm">ATM</option>
                                        <option value="branch">Branch</option>
                                        <option value="phone">Phone</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="time" class="form-label">Time of Day</label>
                                <select class="form-control" id="time" name="time" required>
                                    <option value="">Select Time</option>
                                    <option value="morning">Morning (6 AM - 12 PM)</option>
                                    <option value="afternoon">Afternoon (12 PM - 6 PM)</option>
                                    <option value="evening">Evening (6 PM - 12 AM)</option>
                                    <option value="night">Night (12 AM - 6 AM)</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mb-3">Analyze Transaction</button>
                        </form>

                        <div id="resultContainer" class="hidden-container">
                            <div id="resultAlert"></div>
                            <div class="result-details">
                                <h5>Analysis Result</h5>
                                <div class="row">
                                    <div class="col-md-6">
                                        <p><strong>Status:</strong> <span id="resultStatus"></span></p>
                                    </div>
                                    <div class="col-md-6">
                                        <p><strong>Risk Score:</strong> <span id="resultRiskScore"></span></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('transactionForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(this);

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                const resultContainer = document.getElementById('resultContainer');
                const resultAlert = document.getElementById('resultAlert');
                const resultStatus = document.getElementById('resultStatus');
                const resultRiskScore = document.getElementById('resultRiskScore');

                if (result.is_fraud) {
                    resultAlert.innerHTML = '<div class="alert alert-danger"><strong>⚠️ Fraud Alert!</strong> This transaction appears to be fraudulent.</div>';
                    resultStatus.innerHTML = '<span class="badge bg-danger">FRAUD</span>';
                } else {
                    resultAlert.innerHTML = '<div class="alert alert-success"><strong>✓ Safe Transaction</strong> This transaction appears to be legitimate.</div>';
                    resultStatus.innerHTML = '<span class="badge bg-success">SAFE</span>';
                }

                resultRiskScore.innerHTML = result.risk_score;
                resultContainer.classList.add('show');
            } catch (error) {
                console.error('Error:', error);
                alert('Error analyzing transaction');
            }
        });
    </script>
</body>
</html>
